# Render Blueprint: CardioNova Health

databases:
  - name: heartcare-db
    databaseName: heartcare
    user: heartcare
    plan: free

services:
  - type: web
    name: heart-disease-prediction
    runtime: python
    plan: free

    buildCommand: bash build.sh
    startCommand: gunicorn heart_disease.wsgi:application --workers 2 --timeout 120

    healthCheckPath: /api/health/

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3

      - key: DJANGO_DEBUG
        value: "0"

      - key: SKIP_TRAIN
        value: "1"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: heartcare-db
          property: connectionString

      - key: DJANGO_ADMIN_URL
        sync: false

      - key: DJANGO_TRUSTED_PROXIES
        value: "1"

      - key: DJANGO_SUPERUSER_USERNAME
        value: admin

      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com

      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false