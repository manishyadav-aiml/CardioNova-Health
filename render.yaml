# Render Blueprint: New + > Blueprint > connect your GitHub repository.
databases:
  - name: heartcare-db
    databaseName: heartcare
    user: heartcare
    plan: free

services:
  - type: web
    name: heart-disease-prediction
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn heart_disease.wsgi:application --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: heartcare-db
          property: connectionString
      - key: DJANGO_ADMIN_URL
        sync: false          # choose a private admin path in the Render dashboard, e.g. staff-7f3k/
      - key: DJANGO_TRUSTED_PROXIES
        value: "1"           # Render puts one proxy in front of the app; verify with docs/SECURITY.md
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false          # you type this in the Render dashboard
