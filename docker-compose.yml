# Run the whole system (web app + PostgreSQL) with:   docker compose up --build
# 1. cp .env.example .env     2. put real values in .env (no secrets live in this file)     3. open http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heartcare
      POSTGRES_USER: heartcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # no "ports": the database is reachable only from the web container, never from the host or the internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartcare -d heartcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"                  # only this computer can reach it
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_SECURE_SSL: "0"                   # plain http on localhost
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      DJANGO_TRUSTED_PROXIES: "0"
      DATABASE_URL: postgres://heartcare:${POSTGRES_PASSWORD}@db:5432/heartcare
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}     # empty = no admin account is created
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin/}

volumes:
  pgdata:
