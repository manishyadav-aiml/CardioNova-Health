name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train a quick model
        run: python train_model.py --quick
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests (features, innovation, security)
        run: python manage.py test
      - name: Django deployment checklist
        run: python manage.py check --deploy
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-throwaway-key-0123456789abcdef0123456789
          DJANGO_ALLOWED_HOSTS: example.com
      - name: Repository security scan
        run: python scripts/security_check.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # the whole git history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
